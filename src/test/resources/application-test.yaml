spring:
  datasource:
    url: jdbc:h2:mem:bookcatalog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/test-migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

app:
  seed:
    enabled: false
  pagination:
    max-page-size: 100
  security:
    issuer: book-catalog-test
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
    secret: test-secret-for-jwt-signing-that-is-long-enough-1234567890
