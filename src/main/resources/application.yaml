spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: book-catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/book_catalog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
    generate-ddl: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: ${APP_SQL_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${APP_SQL_BIND_LOG_LEVEL:WARN}

app:
  pagination:
    max-page-size: ${APP_MAX_PAGE_SIZE:1000}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  security:
    issuer: ${JWT_ISSUER:book-catalog}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
    secret: ${JWT_SECRET}
server:
  port: ${SERVER_PORT:8090}