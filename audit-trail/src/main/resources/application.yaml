spring:
  application:
    name: audit-trail
  datasource:
    url: jdbc:postgresql://localhost:5432/audit_trail
    username: postgres
    password: postgres
  jpa:
    generate-ddl: false
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  username: admin
  password: admin